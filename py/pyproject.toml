[project]
name = "talkreel-audio"
version = "0.1.0"
description = "talkreel audio helper: Kokoro TTS and faster-whisper word timestamps, JSON on stdout."
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "kokoro-onnx>=0.6.1,<0.7",
    "faster-whisper>=1.2.1,<2",
]

[dependency-groups]
dev = ["pytest>=8"]
# Opt-in Arabic engines (`uv sync --project py --group arabic`). Never in the default sync or CI.
# The aligner's LICENSE is BSD-2; its pyproject metadata still says CC-BY-NC (see docs/design/m3-reels.md).
arabic = [
    "ctc-forced-aligner @ git+https://github.com/MahmoudAshraf97/ctc-forced-aligner@64293cc6d711e57666c4a8b098e9fd93b381fd88",
]

[tool.uv]
# Not an installable package: the TS CLI puts this directory on PYTHONPATH.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
